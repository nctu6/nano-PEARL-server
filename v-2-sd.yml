services:
  v-1:
    image: vllm/vllm-openai:latest

    # GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    network_mode: host
    shm_size: '2gb'

    volumes:
      - /home/ubuntu/models:/root/models

    environment:
      CUDA_VISIBLE_DEVICES: 0,1

    command: >
      /root/models/Qwen/Qwen3-32B --served-model-name=test --tensor-parallel-size=2 --host=0.0.0.0 --port=30000 --speculative_config='{"method":"ngram","model":"/root/models/Qwen/Qwen3-1.7B","num_speculative_tokens":"3"}'

